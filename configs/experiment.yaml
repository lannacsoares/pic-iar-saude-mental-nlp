# Parametros de referencia do experimento (pre-projeto PIC_PIBIC_11; Sun et al., 2019).
# Fonte: workspace PIC-IAR no Notion. Atualize aqui conforme as decisoes forem tomadas.

seed: 42

models:
  bertimbau: neuralmind/bert-base-portuguese-cased   # escolha primaria (PT-BR), 110M
  xlmr: FacebookAI/xlm-roberta-base                  # baseline multilingue, 270M
  mbert: google-bert/bert-base-multilingual-cased    # baseline multilingue, 110M

preprocessing:
  remove_urls: true
  remove_mentions: true
  limit_excess_emojis: true
  normalize_encoding: true
  max_length: 512          # truncamento; tweets sao curtos, use padding dinamico

training:
  grid:
    learning_rate: [2.0e-5, 3.0e-5, 5.0e-5]
    batch_size: [16, 32]
    epochs: [3, 4, 5]
  warmup_ratio: 0.1
  weight_decay: 0.01
  report_to: [mlflow, wandb]

evaluation:
  split: {train: 0.8, test: 0.2, stratified: true}
  kfold: {k: 5, stratified: true}
  metrics: [accuracy, precision, recall, f1_weighted, roc_auc]
  significance: {test: mcnemar, alpha: 0.05}
  fairness: [equalized_odds, demographic_parity]

baselines:
  - svm_tfidf
  - svm_bow
  - random_forest
